#spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/omsdb
#spring.datasource.username=omsuser
#spring.datasource.password=omspass
#spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# OMS Service Configuration
oms.base-url=https://your-oms-instance.com/api
oms.auth-url=https://your-oms-instance.com/auth
oms.username=your-username
oms.password=your-password
oms.client-id=your-client-id
oms.client-secret=your-client-secret

# Titan Order Count Service Configuration (IBM Sterling OMS)
titan.order-count.url=https://titan-preprod-1.oms.supply-chain.ibm.com/smcfs/restapi/executeFlow/Titan_OrderCount
# Basic auth credentials (optional - leave empty if not required)
titan.order-count.username=your-titan-username
titan.order-count.password=your-titan-password
